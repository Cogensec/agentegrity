<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="754" viewBox="0 0 1320 754" role="img" aria-labelledby="title desc">
<title id="title">Agentegrity architecture: observe and evaluate, authorize and verify</title>
<desc id="desc">Two separate paths. Agent events reach framework adapters, integrity evaluation and optional signed attestations. Tool requests may pass through a trusted host-installed ActionSecurityGate before a real executor, and downstream effects require separately authenticated host verification. Hook observation alone is not hard enforcement.</desc>
