<text x="476" y="635" text-anchor="middle" font-size="12" font-family="Arial,sans-serif" fill="#9E5A48">No tool call, no effect receipt</text>
<path d="M476 558 V583" fill="none" stroke="#B46D54" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
