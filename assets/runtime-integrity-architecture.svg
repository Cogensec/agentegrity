  .section{font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:710;fill:#233F3D}
  .kicker{font-family:Inter,Arial,sans-serif;font-size:11px;letter-spacing:1.1px;font-weight:750;fill:#A65A3C}
  .cardTitle{font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:750;fill:#193333}
  .small{font-family:Inter,Arial,sans-serif;font-size:12.5px;fill:#627574}
