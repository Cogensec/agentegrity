<text x="785" y="615" text-anchor="middle" font-size="15" font-weight="750" font-family="Arial,sans-serif" fill="#335B4D">Effect receipt</text>
<text x="785" y="635" text-anchor="middle" font-size="12" font-family="Arial,sans-serif" fill="#446C5C">Pending / unknown / verified</text>
<path d="M968 621 H911" fill="none" stroke="#778B89" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="968" y="591" width="277" height="61" rx="13" fill="#E7F0EB" stroke="#B5CFC0"/>
<text x="1106" y="614" text-anchor="middle" font-size="15" font-weight="750" font-family="Arial,sans-serif" fill="#335B4D">Independent verifier</text>
<text x="1106" y="635" text-anchor="middle" font-size="12" font-family="Arial,sans-serif" fill="#446C5C">Authenticated downstream evidence</text>
<path d="M1107 558 V582" fill="none" stroke="#778B89" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="78" cy="722" r="5" fill="#C46D4D"/>
<text x="94" y="726" class="note">Host hooks alone may be advisory. Neither the receipt store nor delegated authority is distributed or durable.</text>
