<text x="66" y="69" class="title">How Agentegrity fits into your agent</text>
<text x="66" y="100" class="subtitle">Two complementary paths: visibility into agent integrity, and opt-in authorization at the tool boundary.</text>
<rect x="57" y="128" width="1206" height="228" rx="20" fill="#EEF2EF" stroke="#DCE4DE"/>
<text x="76" y="168" class="section">01 / Observe and evaluate</text>
<text x="365" y="168" class="note">Framework lifecycle events → integrity signals → decision evidence</text>
<g filter="url(#shadow)"><rect x="74" y="204" width="242" height="107" rx="14" fill="#FFFFFF" stroke="#D8DDD9"/></g><rect x="89" y="222" width="5" height="71" rx="2.5" fill="#668A82"/><text x="105" y="234" class="kicker">SOURCE</text><text x="105" y="259" class="cardTitle">Agent events</text><text x="105" y="281" class="small">Prompts · tools · handoffs</text>
<g filter="url(#shadow)"><rect x="374" y="204" width="242" height="107" rx="14" fill="#FFFFFF" stroke="#D8DDD9"/></g><rect x="389" y="222" width="5" height="71" rx="2.5" fill="#668A82"/><text x="405" y="234" class="kicker">INTEGRATE</text><text x="405" y="259" class="cardTitle">Framework adapters</text><text x="405" y="281" class="small">Python evaluation / TS streaming</text>
<g filter="url(#shadow)"><rect x="673" y="204" width="250" height="107" rx="14" fill="#FFFFFF" stroke="#D8DDD9"/></g><rect x="688" y="222" width="5" height="71" rx="2.5" fill="#668A82"/><text x="704" y="234" class="kicker">EVALUATE</text><text x="704" y="259" class="cardTitle">Four integrity layers</text><text x="704" y="281" class="small">Adversarial · cortical · policy</text>
<g filter="url(#shadow)"><rect x="980" y="204" width="266" height="107" rx="14" fill="#FFFFFF" stroke="#D8DDD9"/></g><rect x="995" y="222" width="5" height="71" rx="2.5" fill="#668A82"/><text x="1011" y="234" class="kicker">PROVE</text><text x="1011" y="259" class="cardTitle">Evidence and attestation</text><text x="1011" y="281" class="small">Python chain; signing is opt-in</text>
<path d="M316 256 H366" fill="none" stroke="#778B89" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
