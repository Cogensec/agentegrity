<rect x="57" y="371" width="1206" height="315" rx="20" fill="#F3EFEB" stroke="#E8DED8"/>
<text x="76" y="410" class="section">02 / Authorize and reconcile</text>
<text x="398" y="410" class="note">Trusted-host Python API · explicit opt-in · real tool execution boundary</text>
<g filter="url(#shadow)"><rect x="75" y="446" width="210" height="112" rx="14" fill="#FFFFFF" stroke="#D8DDD9"/></g><rect x="90" y="464" width="5" height="76" rx="2.5" fill="#C46D4D"/><text x="106" y="476" class="kicker">REQUEST</text><text x="106" y="501" class="cardTitle">Agent tool call</text><text x="106" y="523" class="small">Proposed action</text>
<g filter="url(#shadow)"><rect x="349" y="446" width="255" height="112" rx="14" fill="#FFFFFF" stroke="#D8DDD9"/></g><rect x="364" y="464" width="5" height="76" rx="2.5" fill="#C46D4D"/><text x="380" y="476" class="kicker">BOUNDARY</text><text x="380" y="501" class="cardTitle">ActionSecurityGate</text><text x="380" y="523" class="small">Mandate · scope · expiry</text>
<g filter="url(#shadow)"><rect x="667" y="446" width="236" height="112" rx="14" fill="#FFFFFF" stroke="#D8DDD9"/></g><rect x="682" y="464" width="5" height="76" rx="2.5" fill="#C46D4D"/><text x="698" y="476" class="kicker">EXECUTE</text><text x="698" y="501" class="cardTitle">Trusted tool wrapper</text><text x="698" y="523" class="small">invoke() / ainvoke()</text>
<g filter="url(#shadow)"><rect x="968" y="446" width="277" height="112" rx="14" fill="#FFFFFF" stroke="#D8DDD9"/></g><rect x="983" y="464" width="5" height="76" rx="2.5" fill="#C46D4D"/><text x="999" y="476" class="kicker">EXTERNAL</text><text x="999" y="501" class="cardTitle">Downstream system</text><text x="999" y="523" class="small">May commit even on timeout</text>
<path d="M285 503 H341" fill="none" stroke="#778B89" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M604 503 H659" fill="none" stroke="#778B89" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
