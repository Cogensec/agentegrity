name: npm publication credential readiness (manual, read-only)

# This is a safe PRE-TAG check. It cannot create releases, tags, or publish
# packages. Run manually on main after security approval / before GO.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  npm-credential-readiness:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@agentegrity/client
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify registry version policy has not regressed
        run: node --test scripts/registry_version_policy.test.mjs
      - name: Recheck all seven npm version slots without writing
        run: node scripts/check_registry_release_versions.mjs
      - name: Verify current npm token without exposing identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "::error::NPM_TOKEN unavailable in npm environment"
            exit 1
          fi
          if ! npm whoami --registry=https://registry.npmjs.org > /dev/null; then
            echo "::error::NPM_TOKEN is rejected/expired; verify token before any release"
            exit 1
          fi
          {
            echo "## npm v0.13.0 pre-tag credential check: authenticated"
            echo "All seven version slots were rechecked by public registry metadata."
            echo "npm identity and credential deliberately omitted."
            echo "**This does not prove publish permissions to all packages.**"
            echo "See [release GO tracker #106](https://github.com/Cogensec/agentegrity/issues/106)."
          } >> "$GITHUB_STEP_SUMMARY"
