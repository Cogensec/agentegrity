name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Default token is read-only. Registry publication uses explicitly scoped
# OIDC permissions in its dedicated environment-gated jobs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,crypto]"

      - name: Verify Python source, plugins and documentation version parity
        run: python scripts/check_versions.py

      - name: Lint
        run: python -m ruff check src/ tests/

      - name: Type check
        run: python -m mypy src/agentegrity

      - name: Test
        run: python -m pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate long description
        run: python -m twine check dist/*

      - name: Inspect wheel/sdist contents before any publication
        run: python scripts/check_release_artifacts.py dist

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # AI SDK v5 compatibility uses a deliberately isolated npm fixture with
  # legacy Undici/Busboy advisories. Its three behavior tests must pass on
  # every supported Node major before ANY registry publication begins.
  # These tests are not included in `bun run test` from packages/*.
  legacy-ai-sdk-v5-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install modern workspace from frozen lock
        working-directory: clients/typescript
        run: bun install --frozen-lockfile
      - name: Build shared client
        working-directory: clients/typescript
        run: bun run --filter @agentegrity/client build
      - name: Install isolated AI SDK v5 compatibility fixture
        working-directory: clients/typescript/compat/ai-sdk-v5
        run: npm install --ignore-scripts --no-package-lock
      - name: Verify advertised AI SDK v5 behavior
        working-directory: clients/typescript/compat/ai-sdk-v5
        run: npm test

  # Audit the exact separately-installed OPTIONAL frameworks that remain
  # vulnerable upstream. This is a hard publication gate, not advisory CI.
  # No registry job may begin while the audit reports known vulnerabilities
  # or if the audit result cannot be parsed. See active release-approval issue #106 (historical research #97).
  optional-dependency-security-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install CrewAI extra and vulnerability scanner
        run: python -m pip install -e ".[crewai]" pip-audit
      - name: Collect CrewAI optional installation audit
        run: |
          mkdir -p security-evidence
          # The local editable Agentegrity version is not published yet.
          # Skip ONLY editable roots; still audit all installed CrewAI deps.
          pip-audit --skip-editable --format json --output security-evidence/python-crewai.json || true
      - name: Install isolated legacy AI SDK v5 fixture
        working-directory: clients/typescript/compat/ai-sdk-v5
        run: npm install --ignore-scripts --no-package-lock
      - name: Collect isolated AI SDK v5 advisory report
        working-directory: clients/typescript/compat/ai-sdk-v5
        run: |
          npm audit --json --no-package-lock > ../../../../security-evidence/ai-sdk-v5-npm.json || true
      - name: Snapshot the exact installed vulnerable legacy npm versions
        working-directory: clients/typescript/compat/ai-sdk-v5
        run: |
          node - <<'NODE' > ../../../../security-evidence/ai-sdk-v5-installed.json
          const fs = require("node:fs");
          const packages = ["ai5", "undici", "@fastify/busboy"];
          const versions = {};
          for (const name of packages) {
            const manifest = JSON.parse(fs.readFileSync(`node_modules/${name}/package.json`, "utf8"));
            versions[name] = manifest.version;
          }
          process.stdout.write(JSON.stringify(versions));
          NODE
      - name: Enforce approved exact, expiring optional-framework disposition
        run: |
          python scripts/verify_release_dependency_audits.py \
            --pip-audit security-evidence/python-crewai.json \
            --npm-audit security-evidence/ai-sdk-v5-npm.json \
            --disposition-policy docs/releases/v0.13.0-risk-disposition.json \
            --npm-installed security-evidence/ai-sdk-v5-installed.json \
            --fixture-manifest clients/typescript/compat/ai-sdk-v5/package.json \
            --release-version "${GITHUB_REF_NAME#v}"
      - name: Retain release-security evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: optional-framework-security-reports
          path: security-evidence/
          retention-days: 30

  # Validate the current npm publish credential *before* PyPI registration.
  # Without this, a rotated/expired NPM_TOKEN can leave the Python 0.13.0
  # artifacts published while all seven npm package uploads fail.
  # Environment-level NPM_TOKEN secrets are available only in this scope.
  # A successful whoami validates authentication, NOT per-package publish
  # permission or eventual registry availability. Trusted publishing (OIDC)
  # is still the preferred follow-up once the seven packages are configured.
  npm-auth-preflight:
    needs: build-npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@agentegrity/client
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Test npm release-version collision policy
        run: node --test scripts/registry_version_policy.test.mjs
      - name: Reject npm package version conflicts before any Python upload
        run: node scripts/check_registry_release_versions.mjs
      - name: Require a currently valid npm publish token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "::error::NPM_TOKEN is missing; block the release before TestPyPI"
            exit 1
          fi
          if ! npm whoami --registry=https://registry.npmjs.org > /dev/null; then
            echo "::error::NPM_TOKEN is rejected or expired; block before TestPyPI"
            exit 1
          fi
          echo "npm authentication preflight passed (identity hidden)"

  publish-testpypi:
    needs: [build, build-npm, legacy-ai-sdk-v5-tests, optional-dependency-security-gate, npm-auth-preflight]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/agentegrity/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agentegrity/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Install workspace
        run: bun install --frozen-lockfile
        working-directory: clients/typescript
      - name: Verify version parity
        run: bun run check-versions
        working-directory: clients/typescript
      - name: Require patched Undici/esbuild dependency resolutions
        run: node scripts/check-dependency-patches.mjs
        working-directory: clients/typescript

      - name: Build @agentegrity/client first
        run: bun run --filter @agentegrity/client build
        working-directory: clients/typescript
      - name: Build all packages
        run: bun run build
        working-directory: clients/typescript
      - name: Test all packages
        run: bun run test
        working-directory: clients/typescript
      - name: Verify every npm package contains compiled code and types
        run: node scripts/check_release_npm.mjs

      - name: Upload workspace artifact
        uses: actions/upload-artifact@v7
        with:
          name: ts-workspace
          path: clients/typescript/

  publish-npm-client:
    needs: [publish-pypi, build-npm]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@agentegrity/client
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@v8
        with:
          name: ts-workspace
          path: clients/typescript/
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish @agentegrity/client
        run: npm publish --access public
        working-directory: clients/typescript/packages/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-adapters:
    needs: [publish-pypi, build-npm, publish-npm-client]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - claude-sdk
          - langchain
          - openai-agents
          - crewai
          - google-adk
          - vercel-ai
    environment:
      name: npm
      url: https://www.npmjs.com/package/@agentegrity/${{ matrix.package }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@v8
        with:
          name: ts-workspace
          path: clients/typescript/
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish @agentegrity/${{ matrix.package }}
        run: npm publish --access public
        working-directory: clients/typescript/packages/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
