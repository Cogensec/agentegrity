name: Update npm downloads badge

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC (off the :00 rush)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tally downloads across @agentegrity scope
        run: |
          mkdir -p badges
          python scripts/update_npm_badge.py

      - name: Commit badge if changed
        run: |
          git config user.name "requie"
          git config user.email "tarique.smith@gmail.com"
          if [ -n "$(git status --porcelain badges/npm-downloads.json)" ]; then
            git add badges/npm-downloads.json
            git commit -m "chore: update npm downloads badge"
            git push
          else
            echo "No change in download count — nothing to commit."
          fi
