name: Release candidate package verification

# Nonpublishing workflow. Do not add tags as a trigger.
on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "README.md"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "spec/**"
      - "schemas/**"
      - "LICENSE"
      - "MANIFESTO.md"
      - "agentegrity-glossary.md"
      - "clients/typescript/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-candidate.yml"
      - "scripts/check_release_artifacts.py"
      - "scripts/check_release_npm.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python-wheel-sdist-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build and metadata checks
        run: python -m pip install --upgrade build twine
      - name: Build candidate artifacts (no publication)
        run: python -m build
      - name: Inspect release archive metadata and contents
        run: |
          python -m twine check dist/*
          python scripts/check_release_artifacts.py dist
      - name: Clean isolated wheel install and CLI smoke
        run: |
          python -m venv /tmp/agentegrity-smoke
          /tmp/agentegrity-smoke/bin/pip install --no-index --no-deps dist/*.whl
          cd /tmp
          /tmp/agentegrity-smoke/bin/python -m agentegrity doctor
          /tmp/agentegrity-smoke/bin/python -c 'from agentegrity.core.action_security import ActionSecurityGate, TaskMandate, ToolAuthority; print("Runtime Authority imports OK")'
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-python-distributions
          path: dist/
          retention-days: 7

  npm-pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install exactly the checked-in lockfile
        run: bun install --frozen-lockfile
        working-directory: clients/typescript
      - name: Check version and lockfile parity
        run: bun run check-versions
        working-directory: clients/typescript
      - name: Build npm distributions without uploading
        run: |
          bun run --filter @agentegrity/client build
          bun run build
        working-directory: clients/typescript
      - name: Validate all seven package contents (npm pack dry run only)
        run: node scripts/check_release_npm.mjs

  dependency-path-inventory:
    # Records dependency origins; does not treat vulnerable versions as safe.
    # Produces build artifacts for release-risk triage, not a green audit claim.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install all optional Python extras and tree inspector
        run: python -m pip install -e ".[all,dev]" pipdeptree
      - name: Record reverse dependencies of Python advisory packages
        run: |
          mkdir -p audit-inventory
          python -m pipdeptree --reverse --packages chromadb,mcp,uv | tee audit-inventory/python-reverse-dependencies.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install frozen TypeScript workspace
        run: bun install --frozen-lockfile
        working-directory: clients/typescript
      - name: Record npm advisory dependency origins
        run: |
          for package in '@fastify/busboy' undici esbuild uuid; do
            echo "### ${package}"
            bun why "$package" || true
          done | tee ../../audit-inventory/npm-dependency-paths.txt
        working-directory: clients/typescript
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: advisory-dependency-paths
          path: audit-inventory/
          retention-days: 14
