name: Release candidate package verification

# Nonpublishing workflow. Do not add tags as a trigger.
on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "README.md"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "spec/**"
      - "schemas/**"
      - "LICENSE"
      - "MANIFESTO.md"
      - "agentegrity-glossary.md"
      - "clients/typescript/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-candidate.yml"
      - "scripts/check_release_artifacts.py"
      - "scripts/check_release_npm.mjs"
      - "scripts/check_registry_release_versions.mjs"
      - "scripts/registry_version_policy.mjs"
      - "scripts/registry_version_policy.test.mjs"
      - "scripts/verify_release_dependency_audits.py"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python-wheel-sdist-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build and metadata checks
        run: python -m pip install --upgrade build twine
      - name: Build candidate artifacts (no publication)
        run: python -m build
      - name: Inspect release archive metadata and contents
        run: |
          python -m twine check dist/*
          python scripts/check_release_artifacts.py dist
      - name: Clean isolated wheel install and CLI smoke
        run: |
          python -m venv /tmp/agentegrity-smoke
          /tmp/agentegrity-smoke/bin/pip install --no-index --no-deps dist/*.whl
          cd /tmp
          /tmp/agentegrity-smoke/bin/python -m agentegrity doctor
          /tmp/agentegrity-smoke/bin/python -c 'from agentegrity.core.action_security import ActionSecurityGate, TaskMandate, ToolAuthority; print("Runtime Authority imports OK")'
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-python-distributions
          path: dist/
          retention-days: 7

  npm-pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install exactly the checked-in lockfile
        run: bun install --frozen-lockfile
        working-directory: clients/typescript
      - name: Check version and lockfile parity
        run: bun run check-versions
        working-directory: clients/typescript
      - name: Require patched Undici/esbuild dependency resolutions
        run: node scripts/check-dependency-patches.mjs
        working-directory: clients/typescript

      - name: Build npm distributions without uploading
        run: |
          bun run --filter @agentegrity/client build
          bun run build
        working-directory: clients/typescript
      - name: Validate all seven package contents (npm pack dry run only)
        run: node scripts/check_release_npm.mjs

  dependency-path-inventory:
    # Records dependency origins; does not treat vulnerable versions as safe.
    # Produces build artifacts for release-risk triage, not a green audit claim.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install all optional Python extras and tree inspector
        run: python -m pip install -e ".[all,dev]" pipdeptree
      - name: Record reverse dependencies of Python advisory packages
        run: |
          mkdir -p audit-inventory
          python -m pipdeptree --reverse --packages chromadb,mcp,uv | tee audit-inventory/python-reverse-dependencies.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install frozen TypeScript workspace
        run: bun install --frozen-lockfile
        working-directory: clients/typescript
      - name: Record npm advisory dependency origins
        run: |
          for package in '@fastify/busboy' undici esbuild uuid; do
            echo "### ${package}"
            bun why "$package" || true
          done | tee ../../audit-inventory/npm-dependency-paths.txt
        working-directory: clients/typescript
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: advisory-dependency-paths
          path: audit-inventory/
          retention-days: 14

  optional-framework-audit-rehearsal:
    # Nonpublishing verification of the same parser and dependency scopes used
    # by the hard tag-release gate. Vulnerabilities yield a visible warning
    # until remediated; missing/malformed scanner reports are CI failures.
    # A green rehearsal is NOT approval to publish an affected integration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install optional CrewAI framework and audit tool
        run: python -m pip install -e ".[crewai]" pip-audit
      - name: Collect CrewAI dependency audit
        run: |
          mkdir -p security-evidence
          pip-audit --skip-editable --format json --output security-evidence/python-crewai.json || true
      - name: Install isolated legacy AI SDK v5 fixture
        working-directory: clients/typescript/compat/ai-sdk-v5
        run: npm install --ignore-scripts --no-package-lock
      - name: Collect legacy SDK dependency audit
        working-directory: clients/typescript/compat/ai-sdk-v5
        run: npm audit --json --no-package-lock > ../../../../security-evidence/ai-sdk-v5-npm.json || true
      - name: Rehearse hard gate and preserve vulnerability verdict
        id: security-verdict
        run: |
          set +e
          python scripts/verify_release_dependency_audits.py \
            --pip-audit security-evidence/python-crewai.json \
            --npm-audit security-evidence/ai-sdk-v5-npm.json
          result=$?
          set -e
          if [ "$result" -eq 2 ]; then
            echo "::error::Release security audit evidence invalid or missing"
            {
              echo "## v0.13.0 release security: NO-GO"
              echo "Audit evidence is missing or malformed. Fix the scanner/inputs."
              echo "See [release tracker #106](https://github.com/Cogensec/agentegrity/issues/106)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          if [ "$result" -eq 1 ]; then
            echo "::warning::v0.13.0 registry publication remains BLOCKED; see release tracker #106"
            {
              echo "## v0.13.0 release security: NO-GO"
              echo "Supported optional integration dependencies have unresolved audit findings."
              echo "The tag-triggered release job will **fail**. Green PR rehearsal is NOT a waiver."
              echo "See [release tracker #106](https://github.com/Cogensec/agentegrity/issues/106)."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$result" -eq 0 ]; then
            {
              echo "## v0.13.0 dependency audit: clear"
              echo "No advisories in these two scanned optional paths; separate registry and owner approvals still required."
              echo "See [release tracker #106](https://github.com/Cogensec/agentegrity/issues/106)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Unexpected audit verifier exit status: $result"
            exit "$result"
          fi
          exit 0
      - name: Upload complete vulnerability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-optional-framework-security
          path: security-evidence/
          retention-days: 30

  npm-registry-version-availability:
    # Read-only registry metadata query, without secrets, tags or uploads.
    # This does not prove ownership or the future availability of a token.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          package-manager-cache: false
      # On a PR, compare package names/versions to the actual base commit.
      # Once a complete seven-package release is published, unchanged
      # maintenance PRs still pass; new versions/collisions fail closed.
      - name: Fetch PR base manifests for safe published-baseline detection
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
      - name: Test safe released-baseline and new-candidate version policy
        run: node --test scripts/registry_version_policy.test.mjs
      - name: Check seven npm versions without blocking released maintenance PRs
        env:
          PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: node scripts/check_registry_release_versions.mjs
