name: Regenerate modern Bun lockfile (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/regen-modern-lock.yml"
      - "clients/typescript/packages/vercel-ai/package.json"

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Resolve without the optional ai5 fixture
        working-directory: clients/typescript
        run: |
          bun install
          bun install --frozen-lockfile
          bun run check-versions
          if grep -Eq '"ai5":|"ai5@' bun.lock; then
            echo "::error::ai5 must not remain in modern workspace lockfile"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: vetted-modern-bun-lock
          path: clients/typescript/bun.lock

  commit-lock:
    needs: regenerate
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/isolate-optional-agent-framework-audits' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/isolate-optional-agent-framework-audits
      - uses: actions/download-artifact@v8
        with:
          name: vetted-modern-bun-lock
          path: clients/typescript/
      - name: Commit generated lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/typescript/bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile is already current"
            exit 0
          fi
          git commit -m "fix(deps): remove legacy AI SDK v5 graph from modern Bun lockfile"
          git push origin HEAD:refs/heads/security/isolate-optional-agent-framework-audits
