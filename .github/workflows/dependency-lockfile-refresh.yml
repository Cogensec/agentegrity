name: Dependency lockfile refresh (temporary)

# One-time, nonpublishing PR task. Remove this workflow after committing the
# generated lockfile and passing the normal frozen-lockfile CI suite.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dependency-lockfile-refresh.yml"
      - "clients/typescript/package.json"
      - "clients/typescript/packages/**/package.json"

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Resolve patched dependency versions within declared ranges
        working-directory: clients/typescript
        run: |
          # Invalidate only the two stale, nested patch-series resolutions.
          # Bun will fetch package metadata and write new integrity hashes.
          python - <<'PY'
          from pathlib import Path
          p = Path("bun.lock")
          lines = p.read_text().splitlines(keepends=True)
          bad = ("undici@6.29.0", "undici@7.30.0")
          for target in bad:
              candidates = [line for line in lines if target in line]
              assert len(candidates) == 1, f"expected exactly one locked {target}"
              assert '"undici": [' in candidates[0] or '/undici": [' in candidates[0]
              lines = [line for line in lines if target not in line]
          p.write_text("".join(lines))
          PY
          bun install
          bun install --frozen-lockfile
          bun why tsx
          bun why undici
          bun why esbuild
      - name: Require patched Undici 6/7 and esbuild resolutions
        working-directory: clients/typescript
        run: |
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path("bun.lock").read_text()
          checks = {
              "Undici v6": ("undici@6.29.1", "undici@6.29.0"),
              "Undici v7": ("undici@7.30.1", "undici@7.30.0"),
              "esbuild": ("esbuild@0.28.2", "esbuild@0.27.7"),
          }
          for name, (good, bad) in checks.items():
              assert good in text and bad not in text, f"{name}: expected patched {good}; found old {bad}"
              print(f"{name} patch verified: {good}")
          PY
      - name: Validate refreshed workspace
        working-directory: clients/typescript
        run: |
          bun run check-versions
          bun run --filter @agentegrity/client build
          bun run typecheck
          bun run build
          bun run test
          bun run check-coverage
      - name: Inspect package distributions
        run: node scripts/check_release_npm.mjs
      - name: Audit refreshed lockfile (still advisory for optional peers)
        working-directory: clients/typescript
        continue-on-error: true
        run: bun audit
      - name: Upload exact resolved Bun 1.3.10 lockfile for review
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v0-13-refreshed-bun-lockfile
          path: clients/typescript/bun.lock
          retention-days: 7
